spring.application.name=study

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/testspring?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=ssafy
spring.datasource.password=ssafy

# 2. JPA/Hibernate (Dialect 명시적 선언)
# 자동 인식이 안 될 때는 아래 한 줄을 직접 넣어주는 것이 해결책입니다.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create
# Data Source Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Open In View (OSIV)
spring.jpa.open-in-view=false

# SQL Logging & Formatting
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Time Zone Settings
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul