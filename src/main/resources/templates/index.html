<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 메인</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-container {
            background: white;
            padding: 50px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .hero-container h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .hero-container p {
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            width: 80%;
            box-sizing: border-box;
        }
        .btn-primary {
            background-color: #4A90E2;
            color: white;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }
        .btn-primary:hover {
            background-color: #357ABD;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
        }
        .btn-danger {
            background-color: #fff;
            color: #ff4757;
            border: 1px solid #ff4757;
        }
        .btn-danger:hover {
            background-color: #ff4757;
            color: white;
            transform: translateY(-2px);
        }
        .user-greeting {
            font-size: 1.2rem;
            color: #4A90E2;
            font-weight: 700;
            margin-bottom: 30px;
            display: block;
        }
    </style>
</head>
<body>
<div class="hero-container">
    <h1>환영합니다! 👋</h1>

    <div th:if="${memberEmail == null}">
        <p>더 나은 서비스를 경험하기 위해<br>지금 바로 시작해보세요.</p>
        <a href="/member/login" class="btn btn-primary">로그인 / 회원가입</a>
    </div>

    <div th:if="${memberEmail != null}">
        <span class="user-greeting" th:text="|${memberEmail} 님|"></span>
        <p>오늘도 성공적인 하루 되세요!</p>
        <a href="/member/logout" class="btn btn-danger">로그아웃</a>
    </div>
</div>
</body>
</html>
