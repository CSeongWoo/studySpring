<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 및 회원가입</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            background: #f4f7f6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-card {
            background: white;
            width: 400px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        /* 탭 버튼 스타일 */
        .tabs {
            display: flex;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }
        .tab-btn {
            flex: 1;
            padding: 20px 0;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            color: #4A90E2;
            background: white;
            border-bottom: 3px solid #4A90E2;
        }
        /* 폼 영역 스타일 */
        .form-container {
            padding: 40px 30px;
            display: none; /* 기본적으로 숨김 */
            animation: fadeIn 0.4s ease forwards;
        }
        .form-container.active {
            display: block; /* active 클래스가 있을 때만 보임 */
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4A90E2;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #357ABD;
        }
        .error-msg {
            background: #ffeaa7;
            color: #d63031;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="tabs">
        <div class="tab-btn active" onclick="switchTab('login')">로그인</div>
        <div class="tab-btn" onclick="switchTab('register')">회원가입</div>
    </div>

    <div id="login-form" class="form-container active">
        <div th:if="${param.error}" class="error-msg">
            이메일이나 비밀번호를 다시 확인해주세요.
        </div>

        <form action="/member/login" method="post">
            <div class="form-group">
                <label>이메일</label>
                <input type="email" name="email" required placeholder="user@domain.com">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" name="password" required placeholder="비밀번호를 입력하세요">
            </div>
            <button type="submit" class="submit-btn">로그인</button>
        </form>
    </div>

    <div id="register-form" class="form-container">
        <form action="/member/register" method="post">
            <div class="form-group">
                <label>이메일</label>
                <input type="email" name="email" required placeholder="user@domain.com">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" name="password" required placeholder="비밀번호를 입력하세요">
            </div>
            <div class="form-group">
                <label>이름</label>
                <input type="text" name="name" required placeholder="이름을 입력하세요">
            </div>
            <button type="submit" class="submit-btn" style="background-color: #2ecc71;">가입하기</button>
        </form>
    </div>
</div>

<script>
    function switchTab(tabId) {
        // 모든 탭 버튼과 폼 컨테이너에서 active 클래스 제거
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));

        // 클릭한 탭과 연결된 폼에 active 클래스 추가
        if (tabId === 'login') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('login-form').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('register-form').classList.add('active');
        }
    }
</script>
</body>
</html>
